# ESPHome node that talks to the Sengled Pulse Link (C01-BR30) gateway CPU
# over its internal UART (the link between the CPU and the EH-MB05 module).
# Protocol: see ../README.md. Component: ../components/sengled_pulse.
#
# Lamp address (AD)
# -----------------
# Every lamp has a fixed 4-byte address, e.g. 00020056. Where to find it:
#   - new lamp: the QR code on the lamp. Scan it with any QR reader; the text
#     looks like "SN:14411008EU01926;AD:00020056", the address is after "AD:".
#   - lamp already paired: the "Gateway nodes" sensor of this node, or
#     `python3 main.py mode=nodes`.
#
# Lamps
# -----
# Each lamp slot ("Lamp 1", "Lamp 2", ...) is bound to a lamp address at run
# time from the gateway's node list: no addresses in this file, no reflashing
# when lamps change. lamp_slots only has to be >= the number of paired lamps
# (the gateway takes up to 8); a lamp that finds no free slot is logged.
# "Lamp N address" shows which lamp is in a slot ("empty" if none).
#
# Sound: "Equalizer" and "Mute" act on all lamps and the gateway, "Volume"
# on all lamps (the gateway's volume can not be set: it ignores it).
# "Gateway mute/channel" and "Lamp N mute/channel" act on one speaker.
#
# Adding a lamp: power it on near the gateway, put its address (or the whole
# QR text) into "Lamp address", press "Add lamp", wait about 20 s until
# "Pairing status" says "added". Removing: address, then "Remove lamp".

substitutions:
  name: sengled-pulse
  friendly_name: Sengled Pulse

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

external_components:
  - source: github://kernelorg/sengled-pulse-link
    components: [sengled_pulse]
  # or, with this repository checked out next to the config:
  # - source: { type: local, path: ../components }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: pulse_uart
  tx_pin: GPIO17   # -> gateway CPU RX (net of EH-MB05 pin 38 UART_TX)
  rx_pin: GPIO16   # <- gateway CPU TX (net of EH-MB05 pin 39 UART_RX)
  baud_rate: 115200

sengled_pulse:
  id: pulse
  uart_id: pulse_uart
  lamp_slots: 8
  update_interval: 30s   # how often the gateway and every lamp are read
  # optional: mute all lamps and the gateway while a media player on this
  # node plays nothing (speakers muted by hand stay muted)
  # auto_mute:
  #   media_player: speaker_player
  #   delay: 3s
  # optional: rename or hide entities, e.g.
  # audio_source:
  #   options: [3.5mm, network]
  # slots:
  #   - light: { name: Kitchen }
