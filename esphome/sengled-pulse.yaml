# ESPHome node that talks to the Sengled Pulse Link (C01-BR30) gateway CPU
# over its internal UART (the link between the CPU and the EH-MB05 module).
# Protocol: see ../README.md. Helpers: sengled_pulse.h (same directory).
#
# Lamp address (AD)
# -----------------
# Every lamp has a fixed 4-byte address, e.g. 00020056. Where to find it:
#   - new lamp: the QR code on the lamp. Scan it with any QR reader; the text
#     looks like "SN:14411008EU01926;AD:00020056", the address is after "AD:".
#     The phone app reads the same QR code when adding a lamp.
#   - lamp already paired: the "Gateway nodes" sensor of this node, or
#     `python3 main.py mode=nodes`.
#
# Lamps
# -----
# There are 8 lamp slots ("Lamp 1" .. "Lamp 8", the gateway's maximum). They
# are bound to lamp addresses at run time from the gateway's node list: no
# addresses in this file, no reflashing when lamps change.
#   - already paired lamps fill the slots right after boot;
#   - a lamp added with "Add lamp" takes the first free slot;
#   - a removed lamp frees its slot;
#   - the binding is kept in flash, so a lamp keeps its slot after reboots.
# "Lamp N address" shows which lamp is in a slot ("empty" if none). Rename the
# entities in Home Assistant as you like; unused slots can be hidden there.
# The gateway's own lamp is "Gateway lamp".
#
# Adding a lamp: power it on near the gateway, put its address (or the whole
# QR text) into "Lamp address", press "Add lamp", wait about 20 s until
# "Pairing status" says "added".
# Removing: address into "Lamp address", press "Remove lamp".

substitutions:
  name: sengled-pulse
  friendly_name: Sengled Pulse

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - sengled_pulse.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          sengled::slots::bind(&id(lamp_slots));
          sengled::handshake(sengled::MASTER);
          sengled::enum_slaves();
          sengled::speaker_state(sengled::MASTER);
          sengled::lamp_state(sengled::MASTER);
          sengled::get_audio_source();
          sengled::query_config(0);
      # let the lights restore their state without sending anything
      - delay: 5s
      - lambda: |-
          sengled::ready = true;
          sengled::poll_slots();   // slots are filled by now

globals:
  # lamp address per slot, 0 = empty (see "Lamps" above)
  - id: lamp_slots
    type: std::array<uint32_t, 8>
    restore_value: true
    initial_value: "std::array<uint32_t, 8>{}"

packages:
  lamp1: !include { file: lamp_slot.yaml, vars: { slot: 0, n: 1 } }
  lamp2: !include { file: lamp_slot.yaml, vars: { slot: 1, n: 2 } }
  lamp3: !include { file: lamp_slot.yaml, vars: { slot: 2, n: 3 } }
  lamp4: !include { file: lamp_slot.yaml, vars: { slot: 3, n: 4 } }
  lamp5: !include { file: lamp_slot.yaml, vars: { slot: 4, n: 5 } }
  lamp6: !include { file: lamp_slot.yaml, vars: { slot: 5, n: 6 } }
  lamp7: !include { file: lamp_slot.yaml, vars: { slot: 6, n: 7 } }
  lamp8: !include { file: lamp_slot.yaml, vars: { slot: 7, n: 8 } }

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: pulse_uart
  tx_pin: GPIO17   # -> gateway CPU RX (net of EH-MB05 pin 38 UART_TX)
  rx_pin: GPIO16   # <- gateway CPU TX (net of EH-MB05 pin 39 UART_RX)
  baud_rate: 115200

interval:
  # TX queue + RX parser; publishes state from the gateway's replies
  - interval: 20ms
    then:
      - lambda: |-
          sengled::Frame f;
          while (sengled::poll(id(pulse_uart), f)) {
            sengled::pairing::on_frame(f);
            sengled::slots::on_frame(f);
            if (f.dst != sengled::CLIENT) continue;
            if (f.is(2, 4) && f.src == sengled::MASTER) {        // speaker_state
              auto ch = id(channel_sel).at(f.at(2));
              if (ch.has_value()) id(channel_sel).publish_state(*ch);
              auto e = id(eq_sel).at(f.at(3));
              if (e.has_value()) id(eq_sel).publish_state(*e);
              id(mute_sw).publish_state(f.at(4) != 0);
              id(volume_num).publish_state(f.at(5));
            } else if (f.is(1, 3) && f.src == sengled::MASTER) { // lamp_state
              id(light_on).publish_state(f.at(2) == 0);
              id(light_level).publish_state(f.at(3));
            } else if (f.is(4, 7)) {                             // audio source
              auto s = id(source_sel).at(f.at(0));
              if (s.has_value()) id(source_sel).publish_state(*s);
            } else if (f.is(0, 12) && f.at(0) == 0) {            // light memory
              id(memory_sw).publish_state(f.at(2) != 0);
            }
          }
          sengled::pairing::loop();
          if (sengled::pairing::status_changed) {
            sengled::pairing::status_changed = false;
            id(pair_status).publish_state(sengled::pairing::status);
          }
          if (sengled::pairing::nodes_changed) {
            sengled::pairing::nodes_changed = false;
            id(gw_nodes).publish_state(sengled::pairing::nodes);
          }
  # refresh state (also picks up changes made from the phone app)
  - interval: 30s
    then:
      - lambda: |-
          sengled::speaker_state(sengled::MASTER);
          sengled::lamp_state(sengled::MASTER);
          sengled::get_audio_source();
          sengled::poll_slots();

output:
  - platform: template
    id: all_lamps_out
    type: float
    write_action:
      - lambda: sengled::all_lamps(state);
  - platform: template
    id: gateway_lamp_out
    type: float
    write_action:
      - lambda: sengled::one_lamp(sengled::MASTER, state);

light:
  # transitions would flood the UART with brightness frames
  - platform: monochromatic
    name: All lamps
    output: all_lamps_out
    gamma_correct: 1.0
    default_transition_length: 0s
  - platform: monochromatic
    name: Gateway lamp
    output: gateway_lamp_out
    gamma_correct: 1.0
    default_transition_length: 0s

number:
  - platform: template
    id: volume_num
    name: Volume
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    set_action:
      - lambda: |-
          sengled::volume(sengled::ALL, (uint8_t) x);
          sengled::mute(sengled::ALL, false);   // the app unmutes after a volume change
          id(mute_sw).publish_state(false);

switch:
  - platform: template
    id: mute_sw
    name: Mute
    icon: mdi:volume-off
    optimistic: true
    turn_on_action:
      - lambda: sengled::mute(sengled::ALL, true);
    turn_off_action:
      - lambda: sengled::mute(sengled::ALL, false);
  - platform: template
    id: memory_sw
    name: Light memory
    entity_category: config
    optimistic: true
    turn_on_action:
      - lambda: sengled::set_config(sengled::ALL, 0, 1);
    turn_off_action:
      - lambda: sengled::set_config(sengled::ALL, 0, 0);

select:
  # option order = protocol value
  - platform: template
    id: eq_sel
    name: Equalizer
    options: [normal, pop, jazz, classic, rock, movie]
    optimistic: true
    set_action:
      - lambda: |-
          auto i = id(eq_sel).index_of(x);
          if (i.has_value()) sengled::eq(sengled::ALL, *i);
  - platform: template
    id: channel_sel
    name: Channel
    options: [right, left, left+right]
    optimistic: true
    set_action:
      - lambda: |-
          auto i = id(channel_sel).index_of(x);
          if (i.has_value()) sengled::channel(sengled::ALL, *i);
  - platform: template
    id: source_sel
    name: Audio source
    options: [3.5mm, bluetooth]
    optimistic: true
    set_action:
      - lambda: |-
          auto i = id(source_sel).index_of(x);
          if (i.has_value()) sengled::audio_source(*i);

text:
  # lamp address for add/remove: "00020056", or the label/QR text "...;AD:00020056"
  - platform: template
    id: pair_addr
    name: Lamp address
    icon: mdi:identifier
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true

text_sensor:
  - platform: template
    id: pair_status
    name: Pairing status
    icon: mdi:link-variant
    entity_category: diagnostic
  - platform: template
    id: gw_nodes
    name: Gateway nodes
    icon: mdi:lightbulb-group
    entity_category: diagnostic

button:
  - platform: template
    name: Add lamp
    icon: mdi:link-plus
    entity_category: config
    on_press:
      - lambda: sengled::pairing::start_add(id(pair_addr).state);
  - platform: template
    name: Remove lamp
    icon: mdi:link-off
    entity_category: config
    on_press:
      - lambda: sengled::pairing::start_remove(id(pair_addr).state);
  - platform: template
    name: Refresh node list
    icon: mdi:refresh
    entity_category: diagnostic
    on_press:
      - lambda: sengled::enum_slaves();

sensor:
  - platform: template
    id: light_level
    name: Gateway lamp brightness
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    id: light_on
    name: Gateway lamp on
