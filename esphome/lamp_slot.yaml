# One runtime-bound lamp slot (light with state read-back, volume, mute,
# channel, address, identify),
# included once per slot from sengled-pulse.yaml (see "Lamp slots" there).
# vars: slot = 0-based index, n = number shown in entity names.

output:
  - platform: template
    id: lamp_slot_out_${slot}
    type: float
    write_action:
      - lambda: sengled::slot_lamp(${slot}, state);

light:
  - platform: monochromatic
    id: lamp_slot_light_${slot}
    name: Lamp ${n}
    output: lamp_slot_out_${slot}
    gamma_correct: 1.0
    default_transition_length: 0s

text_sensor:
  - platform: template
    id: lamp_slot_addr_${slot}
    name: Lamp ${n} address
    icon: mdi:identifier
    entity_category: diagnostic

button:
  - platform: template
    name: Identify lamp ${n}
    entity_category: diagnostic
    on_press:
      - lambda: sengled::slot_identify(${slot});

number:
  - platform: template
    id: lamp_slot_volume_${slot}
    name: Lamp ${n} volume
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    set_action:
      - lambda: |-
          sengled::slot_volume(${slot}, (uint8_t) x);
          id(lamp_slot_mute_${slot}).publish_state(false);

switch:
  - platform: template
    id: lamp_slot_mute_${slot}
    name: Lamp ${n} mute
    icon: mdi:volume-off
    optimistic: true
    restore_mode: DISABLED   # no command at boot, state is read back
    turn_on_action:
      - lambda: sengled::slot_mute(${slot}, true);
    turn_off_action:
      - lambda: sengled::slot_mute(${slot}, false);

select:
  # option order = protocol value
  - platform: template
    id: lamp_slot_channel_${slot}
    name: Lamp ${n} channel
    icon: mdi:speaker
    options: [right, left, left+right]
    optimistic: true
    set_action:
      - lambda: |-
          auto i = id(lamp_slot_channel_${slot}).index_of(x);
          if (i.has_value()) sengled::slot_channel(${slot}, *i);

interval:
  # publish this slot's address, light and sound state (only on change);
  # short, so commands to all lamps show up in the slots at once
  - interval: 200ms
    then:
      - lambda: |-
          // address: publish only when it changes (no log spam)
          static std::string last_addr;
          std::string a = sengled::slots::text(${slot});
          if (a != last_addr) {
            last_addr = a;
            id(lamp_slot_addr_${slot}).publish_state(a);
          }
          // light: show the lamp's real on/off and brightness without
          // writing it back to the lamp (no output write is triggered)
          auto &l = sengled::slots::light[${slot}];
          if (l.changed) {
            l.changed = false;
            auto *ls = id(lamp_slot_light_${slot});
            ls->remote_values.set_state(l.on);
            if (l.on && l.level > 0) ls->remote_values.set_brightness(l.level / 100.0f);
            ls->current_values = ls->remote_values;
            ls->publish_state();
          }
          auto &s = sengled::slots::sound[${slot}];
          if (!s.changed) return;
          s.changed = false;
          id(lamp_slot_mute_${slot}).publish_state(s.mute != 0);
          id(lamp_slot_volume_${slot}).publish_state(s.volume);
          auto ch = id(lamp_slot_channel_${slot}).at(s.channel);
          if (ch.has_value()) id(lamp_slot_channel_${slot}).publish_state(*ch);
